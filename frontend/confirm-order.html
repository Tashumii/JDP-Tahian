<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Confirm Your Order | Joey Tahian</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" referrerpolicy="no-referrer">
    <link href="assets/css/style.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" referrerpolicy="no-referrer">
</head>
<body class="bg-light">
    <div class="container py-4">
        <main class="glass-card success-card animate-fade-up text-center" style="max-width:540px;margin:10vh auto;">
            <i class="fa-solid fa-envelope-circle-check check-icon text-gradient" style="font-size:4rem;"></i>
            <h1 class="fw-bold mb-2" id="confirmTitle">Confirm your order</h1>
            <p class="text-secondary mb-4" id="confirmMessage" aria-live="polite">Click below to confirm that you placed this order.</p>
            <div class="p-4 mb-4 mx-auto" style="background:var(--accent-light);border-radius:var(--radius-md);max-width:360px;">
                <span class="section-label d-block mb-2">Order Number</span>
                <span class="fw-bold text-gradient" id="confirmedOrderNo">Awaiting confirmation</span>
            </div>
            <button type="button" class="btn btn-modern rounded-pill px-5 py-3 fw-bold" id="confirmOrderButton">Confirm Order</button>
            <div class="mt-4"><a href="index.html" class="text-secondary">Return to store</a></div>
        </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js" referrerpolicy="no-referrer"></script>
    <script src="assets/js/api.js?v=5"></script>
    <script>
        $(function() {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token') || '';
            history.replaceState({}, document.title, window.location.pathname);
            const button = $('#confirmOrderButton');

            if (!/^[a-f0-9]{64}$/i.test(token)) {
                $('#confirmTitle').text('Invalid confirmation link');
                $('#confirmMessage').text('This link is missing or invalid. Contact the store if you need help.');
                button.prop('disabled', true).addClass('d-none');
                return;
            }

            button.on('click', function() {
                button.prop('disabled', true).html('<span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Confirming…');
                api('orders/confirm.php', 'POST', { token }).done(function(response) {
                    const orderNo = response.data && response.data.order_no;
                    $('#confirmTitle').text('Order confirmed');
                    $('#confirmMessage').text(response.message || 'Your order is confirmed.');
                    $('#confirmedOrderNo').text(orderNo || 'Confirmed');
                    button.addClass('d-none');
                }).fail(function(xhr) {
                    const message = xhr.responseJSON && xhr.responseJSON.message
                        ? xhr.responseJSON.message
                        : 'We could not confirm this order. Please try again.';
                    $('#confirmMessage').text(message);
                    button.prop('disabled', false).text('Try Again');
                });
            });
        });
    </script>
</body>
</html>
