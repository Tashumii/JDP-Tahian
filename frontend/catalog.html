<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalog | Joey Tahian</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light text-dark">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light navbar-glass">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 text-dark" href="index.html">
                <i class="fa-solid fa-scissors me-2 text-gradient"></i>Joey Tahian
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <div class="ms-auto d-flex align-items-center gap-1">
                    <a href="index.html" class="nav-link text-dark fw-semibold">Home</a>
                    <a href="catalog.html" class="nav-link text-dark fw-semibold">Catalog</a>
                    <a href="quote.html" class="nav-link text-dark fw-semibold">Quote</a>
                    <a href="order.html" class="btn btn-modern ms-2 px-4">Place Order</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <div class="container page-header animate-fade-up">
        <div class="text-center">
            <p class="section-label mb-2">Browse our collection</p>
            <h1 class="display-4 fw-bold mb-3">Our <span class="text-gradient">Complete Catalog</span></h1>
            <p class="text-secondary mx-auto" style="max-width: 540px;">
                Browse our full collection of blankets, bedsheets, curtains, and sewing products. See something you love? Head to the order page to purchase.
            </p>
        </div>
    </div>

    <!-- Search + Grid -->
    <div class="container pb-5 animate-fade-up delay-1">
        <!-- Search bar -->
        <div class="row justify-content-center mb-5">
            <div class="col-md-6 col-lg-5">
                <div class="input-group">
                    <span class="input-group-text glass-input border-end-0 bg-transparent text-secondary" style="border-radius: 10px 0 0 10px !important; padding-right: 0.5rem !important;">
                        <i class="fa-solid fa-search"></i>
                    </span>
                    <input type="text" id="catalogSearch" class="form-control glass-input border-start-0" placeholder="Search blankets, curtains, bedsheets…" style="border-radius: 0 10px 10px 0 !important;">
                </div>
            </div>
        </div>

        <!-- Cards -->
        <div class="bento-grid" id="catalogContainer">
            <!-- JS loaded -->
        </div>
    </div>

    <!-- Footer -->
    <footer class="border-top py-4" style="border-color: var(--card-border) !important;">
        <div class="container text-center text-secondary" style="font-size: 0.85rem;">
            <p class="mb-0">© 2026 <strong>Joey Tahian</strong> — Blankets, Bedsheets & Curtains.</p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script>
        $(function() {
            function loadCatalog(search = '') {
                api('quotes/catalog.php?search=' + encodeURIComponent(search)).done(function(res) {
                    let container = $('#catalogContainer');
                    container.empty();

                    if (res.data.length === 0) {
                        container.html('<div class="col-12 text-center text-secondary py-5"><i class="fa-solid fa-box-open fs-1 opacity-30 d-block mb-3"></i>No items found matching your search.</div>');
                        return;
                    }

                    res.data.forEach(item => {
                        let stockBadge = item.quantity > 0
                            ? `<span class="product-stock text-success bg-success bg-opacity-10 border border-success border-opacity-25"><i class="fa-solid fa-check"></i> In Stock</span>`
                            : `<span class="product-stock text-danger bg-danger bg-opacity-10 border border-danger border-opacity-25"><i class="fa-solid fa-xmark"></i> Out of Stock</span>`;

                        let safeSrc = '';
                        try {
                            const parsed = new URL(item.image_url, window.location.href);
                            if (['http:', 'https:'].includes(parsed.protocol)) safeSrc = parsed.href;
                        } catch (e) { safeSrc = ''; }
                        let imgHtml = safeSrc
                            ? `<img src="${$('<div>').text(safeSrc).html()}" alt="${$('<div>').text(item.name).html()}" class="w-100 mb-4" style="border-radius:12px;height:180px;object-fit:cover;">`
                            : `<div class="w-100 mb-4 d-flex align-items-center justify-content-center" style="border-radius:12px;height:180px;background:rgba(0,0,0,0.04);"><i class="fa-solid fa-image fs-1 text-secondary opacity-30"></i></div>`;

                        let card = `
                            <div class="glass-card bento-item">
                                <div>
                                    ${imgHtml}
                                    <div class="mb-3">${stockBadge}</div>
                                    <h5 class="fw-bold mb-1">${$('<div>').text(item.name).html()}</h5>
                                    <p class="text-secondary mb-0" style="font-size:0.88rem;">${$('<div>').text(item.category).html()}</p>
                                </div>
                                <div class="d-flex justify-content-between align-items-center mt-4 pt-3" style="border-top:1px solid var(--card-border);">
                                    <div class="product-price">₱${parseFloat(item.price).toFixed(2)}</div>
                                    <a href="order.html" class="btn btn-outline-dark btn-sm rounded-pill px-3 fw-semibold">Buy Now</a>
                                </div>
                            </div>`;
                        container.append(card);
                    });
                });
            }

            loadCatalog();

            let searchTimeout;
            $('#catalogSearch').on('input', function() {
                clearTimeout(searchTimeout);
                let val = $(this).val();
                searchTimeout = setTimeout(() => loadCatalog(val), 300);
            });
        });
    </script>
</body>
</html>
