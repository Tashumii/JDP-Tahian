<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Received | Joey Tahian</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .success-glow {
            position: fixed;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(16,185,129,0.25) 0%, transparent 70%);
            top: 50%; left: 50%;
            transform: translate(-50%,-50%);
            z-index: 0; pointer-events: none;
        }
        .success-card {
            max-width: 540px;
            margin: 10vh auto;
            position: relative; z-index: 1;
            text-align: center;
        }
        .check-icon {
            font-size: 5rem;
            color: #10b981;
            margin-bottom: 1.5rem;
            filter: drop-shadow(0 0 24px rgba(16,185,129,0.4));
            animation: scaleIn 0.5s cubic-bezier(0.16,1,0.3,1) both;
        }
        @keyframes scaleIn {
            from { transform: scale(0); opacity: 0; }
            to   { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="bg-light">
    <div class="success-glow"></div>
    <div class="container py-4">
        <div class="glass-card success-card animate-fade-up">
            <i class="fa-solid fa-circle-check check-icon"></i>
            <h1 class="fw-bold mb-2" id="confirmationTitle">Order Received</h1>
            <p class="text-secondary mb-5" id="confirmationMessage" style="font-size:1rem; line-height:1.6;">
                Check your email for a confirmation link. Your order will be confirmed after you click it.
            </p>

            <div class="p-4 mb-5 mx-auto" style="background:var(--accent-light); border-radius:var(--radius-md); max-width:360px;">
                <span class="section-label d-block mb-2">Order Number</span>
                <span class="fw-bold text-gradient" id="orderNo" style="font-size:1.8rem; letter-spacing:0.05em;"></span>
            </div>

            <div class="d-flex flex-wrap justify-content-center gap-3">
                <a href="order.html" class="btn btn-outline-dark rounded-pill px-4 py-2 fw-semibold">
                    <i class="fa-solid fa-cart-plus me-2"></i>Order More
                </a>
                <a href="index.html" class="btn btn-modern rounded-pill px-5 py-2 fw-bold">
                    <i class="fa-solid fa-house me-2"></i>Return to Store
                </a>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const orderNo = params.get('order_no') || '';
        if (/^ORD-[A-F0-9]{16}$/.test(orderNo)) {
            document.getElementById('orderNo').textContent = orderNo;
            if (params.get('email_sent') !== '1') {
                document.getElementById('confirmationMessage').textContent = 'Your order was saved, but we could not send the confirmation email. Contact the store and provide your order number.';
            }
        } else {
            document.getElementById('confirmationTitle').textContent = 'No order found';
            document.getElementById('confirmationMessage').textContent = 'Place an order first to receive a confirmation number.';
            document.getElementById('orderNo').textContent = '—';
        }
    </script>
</body>
</html>
