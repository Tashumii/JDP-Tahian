<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Settings | Admin — Joey Tahian</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light text-dark">
    <nav class="navbar navbar-expand-lg navbar-light navbar-glass">
        <div class="container-fluid px-4 px-lg-5">
            <a class="navbar-brand fw-bold fs-5 text-dark" href="dashboard.html">
                <i class="fa-solid fa-scissors me-2 text-gradient"></i>Admin Workspace
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#adminNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="adminNav">
                <ul class="navbar-nav me-auto ms-3 gap-1">
                    <li class="nav-item"><a class="nav-link fw-semibold text-secondary" href="dashboard.html"><i class="fa-solid fa-chart-pie me-2"></i>Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold text-secondary" href="inventory.html"><i class="fa-solid fa-boxes-stacked me-2"></i>Inventory</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold text-secondary" href="orders.html"><i class="fa-solid fa-cart-flatbed me-2"></i>Orders</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold text-secondary" href="quotes.html"><i class="fa-solid fa-file-invoice-dollar me-2"></i>Quotes</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold text-secondary" href="reports.html"><i class="fa-solid fa-file-export me-2"></i>Reports</a></li>
                    <li class="nav-item"><a class="nav-link fw-bold text-dark" href="settings.html"><i class="fa-solid fa-gear me-2"></i>Settings</a></li>
                </ul>
                <button class="btn btn-outline-dark btn-sm rounded-pill px-4" id="logoutBtn"><i class="fa-solid fa-power-off me-2"></i>Logout</button>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 px-lg-5 py-5 animate-fade-up">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <h2 class="fw-bold mb-1">Email / SMTP Settings</h2>
                <p class="text-secondary mb-4">Configure the email account used for order confirmations.</p>

                <div id="settingsFeedback" class="alert d-none" role="status"></div>

                <div class="glass-card">
                    <form id="settingsForm" novalidate>
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label">SMTP Host</label>
                                <input type="text" class="form-control glass-input" id="smtp_host" name="smtp_host" required placeholder="smtp.gmail.com">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">SMTP Port</label>
                                <input type="number" class="form-control glass-input" id="smtp_port" name="smtp_port" required placeholder="587">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">SMTP Username</label>
                                <input type="text" class="form-control glass-input" id="smtp_username" name="smtp_username" placeholder="you@gmail.com">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">SMTP Password / App Password</label>
                                <input type="password" class="form-control glass-input" id="smtp_password" name="smtp_password" placeholder="Leave blank to keep existing">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Encryption</label>
                                <select class="form-select glass-input" id="smtp_encryption" name="smtp_encryption">
                                    <option value="tls">TLS (587)</option>
                                    <option value="ssl">SSL (465)</option>
                                    <option value="none">None</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">From Email</label>
                                <input type="email" class="form-control glass-input" id="from_email" name="from_email" placeholder="you@gmail.com">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">From Name</label>
                                <input type="text" class="form-control glass-input" id="from_name" name="from_name" placeholder="Joey Tahian">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">App Base URL</label>
                                <input type="url" class="form-control glass-input" id="app_base_url" name="app_base_url" placeholder="https://example.com/frontend">
                            </div>
                        </div>
                        <div class="mt-4">
                            <button type="submit" class="btn btn-modern rounded-pill px-5">Save Settings</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/api.js?v=5"></script>
    <script>
        $(function() {
            function showFeedback(message, success) {
                $('#settingsFeedback').removeClass('d-none alert-success alert-danger')
                    .addClass(success ? 'alert-success' : 'alert-danger')
                    .text(message);
            }

            api('settings/get_mail.php').done(function(res) {
                const data = res.data || {};
                $('#smtp_host').val(data.smtp_host || '');
                $('#smtp_port').val(data.smtp_port || 587);
                $('#smtp_username').val(data.smtp_username || '');
                $('#smtp_encryption').val(data.smtp_encryption || 'tls');
                $('#from_email').val(data.from_email || '');
                $('#from_name').val(data.from_name || 'Joey Tahian');
                $('#app_base_url').val(data.app_base_url || '');
            });

            $('#settingsForm').on('submit', function(event) {
                event.preventDefault();
                const payload = {
                    smtp_host: $('#smtp_host').val().trim(),
                    smtp_port: $('#smtp_port').val(),
                    smtp_username: $('#smtp_username').val().trim(),
                    smtp_password: $('#smtp_password').val(),
                    smtp_encryption: $('#smtp_encryption').val(),
                    from_email: $('#from_email').val().trim(),
                    from_name: $('#from_name').val().trim(),
                    app_base_url: $('#app_base_url').val().trim()
                };
                api('settings/save_mail.php', 'POST', payload).done(function(res) {
                    showFeedback(res.message || 'Settings saved.', true);
                    $('#smtp_password').val('');
                }).fail(function(xhr) {
                    showFeedback(xhr.responseJSON && xhr.responseJSON.message ? xhr.responseJSON.message : 'Could not save settings.', false);
                });
            });

            $('#logoutBtn').click(function() {
                api('auth/logout.php', 'POST').done(function() {
                    sessionStorage.removeItem('joey_csrf_token');
                    window.location.href = 'login.html';
                });
            });
        });
    </script>
</body>
</html>
