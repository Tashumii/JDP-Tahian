<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders | Admin — Joey Tahian</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light text-dark">

    <!-- Admin Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light navbar-glass">
        <div class="container-fluid px-4 px-lg-5">
            <a class="navbar-brand fw-bold fs-5 text-dark" href="dashboard.html">
                <i class="fa-solid fa-scissors me-2 text-gradient"></i>Admin Workspace
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#adminNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="adminNav">
                <ul class="navbar-nav me-auto ms-3 gap-1">
                    <li class="nav-item"><a class="nav-link fw-semibold text-secondary" href="dashboard.html"><i class="fa-solid fa-chart-pie me-2"></i>Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold text-secondary" href="inventory.html"><i class="fa-solid fa-boxes-stacked me-2"></i>Inventory</a></li>
                    <li class="nav-item"><a class="nav-link fw-bold text-dark" href="orders.html"><i class="fa-solid fa-cart-flatbed me-2"></i>Orders</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold text-secondary" href="quotes.html"><i class="fa-solid fa-file-invoice-dollar me-2"></i>Quotes</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold text-secondary" href="reports.html"><i class="fa-solid fa-file-export me-2"></i>Reports</a></li>
                </ul>
                <button class="btn btn-outline-dark btn-sm rounded-pill px-4" id="logoutBtn">
                    <i class="fa-solid fa-power-off me-2"></i>Logout
                </button>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <div class="container-fluid px-4 px-lg-5 py-5 animate-fade-up">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1" style="letter-spacing:-0.02em;">Orders Management</h2>
                <p class="text-secondary mb-0" style="font-size:0.9rem;">View and update customer order statuses.</p>
            </div>
        </div>

        <div id="ordersFeedback" class="alert d-none" role="status" aria-live="polite"></div>

        <div class="glass-card no-hover p-0 overflow-hidden">
            <div class="table-responsive">
                <table class="table table-glass mb-0" id="ordersTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Order No.</th>
                            <th>Customer</th>
                            <th>Contact</th>
                            <th>Shipping Address</th>
                            <th>Items</th>
                            <th>Payment</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Date</th>
                            <th class="text-end">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td colspan="11" class="text-center text-secondary py-4"><span class="spinner-border spinner-border-sm me-2"></span>Loading…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Update Status Modal -->
    <div class="modal fade" id="statusModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content glass-card shadow-lg" style="padding:0;">
                <form id="statusForm" novalidate>
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold">Update Order Status</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="orderId" name="id">
                        <div class="mb-3">
                            <label class="form-label">New Status</label>
                            <select class="form-select glass-input" id="orderStatus" name="status">
                                <option value="pending">Pending</option>
                                <option value="confirmed">Confirmed</option>
                                <option value="packed">Packed</option>
                                <option value="delivered">Delivered</option>
                                <option value="cancelled">Cancelled</option>
                            </select>
                        </div>
                        <div id="statusError" class="alert alert-danger d-none mb-0" role="alert"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-modern rounded-pill px-5">Update Status</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/api.js?v=5"></script>
    <script>
        $(function() {
            function loadOrders() {
                api('orders/list.php').done(function(res) {
                    let tbody = $('#ordersTable tbody');
                    tbody.empty();

                    if (!res.data || res.data.length === 0) {
                        tbody.html('<tr><td colspan="11" class="text-center text-secondary py-5"><i class="fa-solid fa-inbox fs-2 d-block opacity-30 mb-2"></i>No orders found.</td></tr>');
                        return;
                    }

                    res.data.forEach(order => {
                        const statusMap = {
                            pending:   'bg-secondary bg-opacity-10 text-secondary border border-secondary border-opacity-50',
                            confirmed: 'bg-info bg-opacity-10 text-info border border-info border-opacity-50',
                            packed:    'bg-primary bg-opacity-10 text-primary border border-primary border-opacity-50',
                            delivered: 'bg-success bg-opacity-10 text-success border border-success border-opacity-50',
                            cancelled: 'bg-danger bg-opacity-10 text-danger border border-danger border-opacity-50',
                        };
                        let badgeColor = statusMap[order.status] || statusMap.pending;

                        tbody.append(`
                            <tr>
                                <td class="text-secondary" style="font-size:0.85rem;">${order.id}</td>
                                <td><span class="fw-bold text-gradient">${order.order_no}</span></td>
                                <td class="fw-semibold">${$('<div>').text(order.customer_name).html()}</td>
                                <td>
                                    <div style="font-size:0.88rem;"><i class="fa-solid fa-mobile-screen me-1 text-secondary"></i>${$('<div>').text(order.mobile || '—').html()}</div>
                                    <small class="text-secondary"><i class="fa-solid fa-envelope me-1"></i>${$('<div>').text(order.email || '—').html()}</small>
                                </td>
                                <td style="font-size:0.88rem;max-width:240px;">${$('<div>').text(order.address || '—').html()}</td>
                                <td style="font-size:0.88rem;max-width:220px;">${$('<div>').text(order.items_summary || '—').html()}</td>
                                <td style="font-size:0.88rem;">${$('<div>').text(order.payment_method || 'COD').html()}</td>
                                <td class="fw-bold">₱${parseFloat(order.total).toFixed(2)}</td>
                                <td>
                                    <span class="badge ${badgeColor}" style="text-transform:capitalize;">${order.status}</span>
                                    <small class="d-block mt-1 ${order.email_confirmed_at ? 'text-success' : 'text-secondary'}">${order.email_confirmed_at ? 'Confirmed by email' : (order.status === 'pending' ? (order.confirmation_email_sent_at ? 'Email sent' : 'Email not sent') : '')}</small>
                                </td>
                                <td class="text-secondary" style="font-size:0.82rem; white-space:nowrap;">${order.created_at}</td>
                                <td class="text-end">
                                    <div class="d-flex flex-column align-items-end gap-2">
                                        <button class="btn btn-sm btn-outline-dark rounded-pill px-3 btn-status" data-id="${order.id}" data-status="${order.status}" ${['delivered', 'cancelled'].includes(order.status) ? 'disabled' : ''}>
                                            <i class="fa-solid fa-pen-to-square me-1"></i>Update
                                        </button>
                                        ${order.status === 'pending' ? `<button class="btn btn-sm btn-outline-primary rounded-pill px-3 btn-resend" data-id="${order.id}"><i class="fa-solid fa-envelope me-1"></i>${order.confirmation_email_sent_at ? 'Resend email' : 'Send email'}</button>` : ''}
                                    </div>
                                </td>
                            </tr>
                        `);
                    });
                }).fail(function(xhr) {
                    tbody.html('<tr><td colspan="11" class="text-center text-secondary py-4">Orders could not be loaded.</td></tr>');
                    $('#ordersFeedback').text(xhr.responseJSON && xhr.responseJSON.message ? xhr.responseJSON.message : 'Unable to load orders.')
                        .removeClass('d-none alert-success').addClass('alert-danger');
                });
            }

            loadOrders();
            setInterval(function() {
                if (!document.hidden) loadOrders();
            }, 30000);
            $(window).on('focus', loadOrders);

            $(document).on('click', '.btn-status', function() {
                const allowed = {
                    pending: ['confirmed', 'cancelled'],
                    confirmed: ['packed', 'cancelled'],
                    packed: ['delivered'],
                    delivered: [],
                    cancelled: []
                };
                const currentStatus = $(this).data('status');
                const choices = allowed[currentStatus] || [];
                $('#orderStatus').empty();
                choices.forEach(function(status) {
                    $('#orderStatus').append($('<option>').val(status).text(status.charAt(0).toUpperCase() + status.slice(1)));
                });
                $('#statusError').addClass('d-none').text('');
                $('#orderId').val($(this).data('id'));
                new bootstrap.Modal(document.getElementById('statusModal')).show();
            });

            $('#statusForm').submit(function(e) {
                e.preventDefault();
                if ($('#orderStatus').val() === 'cancelled' && !window.confirm('Cancel this order and return its quantities to inventory?')) return;
                const submit = $(this).find('button[type="submit"]');
                submit.prop('disabled', true);
                $('#statusError').addClass('d-none').text('');
                api('orders/update_status.php', 'POST', $(this).serialize()).done(function() {
                    bootstrap.Modal.getInstance(document.getElementById('statusModal')).hide();
                    loadOrders();
                }).fail(function(xhr) {
                    $('#statusError').text(xhr.responseJSON && xhr.responseJSON.message ? xhr.responseJSON.message : 'Unable to update order status.').removeClass('d-none');
                }).always(function() {
                    submit.prop('disabled', false);
                });
            });

            $('#ordersTable').on('click', '.btn-resend', function() {
                const button = $(this);
                button.prop('disabled', true).html('<span class="spinner-border spinner-border-sm me-1"></span>Sending…');
                $('#ordersFeedback').addClass('d-none').text('');
                api('orders/resend_confirmation.php', 'POST', { id: Number(button.data('id')) }).done(function(response) {
                    $('#ordersFeedback').removeClass('d-none alert-danger').addClass('alert-success')
                        .text(response.message || 'Confirmation email sent.');
                    loadOrders();
                }).fail(function(xhr) {
                    $('#ordersFeedback').removeClass('d-none alert-success').addClass('alert-danger')
                        .text(xhr.responseJSON && xhr.responseJSON.message ? xhr.responseJSON.message : 'Unable to send the confirmation email.');
                    button.prop('disabled', false).html('<i class="fa-solid fa-envelope me-1"></i>Retry email');
                });
            });

            $('#logoutBtn').click(function() {
                api('auth/logout.php', 'POST').done(() => window.location.href = 'login.html');
            });
        });
    </script>
</body>
</html>
