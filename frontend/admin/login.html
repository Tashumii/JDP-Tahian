<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Joey Tahian</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light text-dark d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="hero-glow"></div>

    <div class="container animate-fade-up" style="max-width: 440px;">
        <div class="text-center mb-5">
            <span style="display:inline-flex;align-items:center;justify-content:center;width:72px;height:72px;border-radius:20px;background:var(--accent-light);margin-bottom:1.25rem;">
                <i class="fa-solid fa-scissors fs-2 text-gradient"></i>
            </span>
            <h2 class="fw-bold mb-1" style="letter-spacing:-0.02em;">Admin Access</h2>
            <p class="text-secondary mb-0" style="font-size:0.9rem;">Restricted to authorized personnel only.</p>
        </div>

        <div class="glass-card">
            <div id="loginAlert" class="alert alert-danger d-none mb-4 p-3" role="alert" style="border-radius:10px; font-size:0.9rem;"></div>

            <form id="loginForm" novalidate>
                <div class="mb-3">
                    <label for="username" class="form-label">Admin ID</label>
                    <input type="text" class="form-control glass-input" id="username" required placeholder="Enter your username" autocomplete="username">
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Passcode</label>
                    <input type="password" class="form-control glass-input" id="password" required placeholder="Enter your password" autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-modern w-100 py-3 fw-bold fs-5">
                    Authenticate <i class="fa-solid fa-unlock-keyhole ms-2"></i>
                </button>
            </form>
        </div>

        <p class="text-center text-secondary mt-4" style="font-size:0.8rem;">
            <i class="fa-solid fa-lock me-1 opacity-50"></i> Session-secured admin panel
        </p>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="../assets/js/api.js?v=5"></script>
    <script>
        $(function() {
            $('#loginForm').submit(function(e) {
                e.preventDefault();
                $('#loginAlert').addClass('d-none');

                api('auth/login.php', 'POST', {
                    username: $('#username').val(),
                    password: $('#password').val()
                }).done(function(res) {
                    if (res.status === 'success') window.location.href = 'dashboard.html';
                }).fail(function(jqXHR) {
                    let msg = jqXHR.responseJSON ? jqXHR.responseJSON.message : 'Login failed. Check your credentials.';
                    $('#loginAlert').html('<i class="fa-solid fa-circle-exclamation me-2"></i>' + msg).removeClass('d-none');
                });
            });
        });
    </script>
</body>
</html>
