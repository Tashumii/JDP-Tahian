<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports | Admin Workspace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light text-dark">

    <nav class="navbar navbar-expand-lg navbar-light navbar-glass py-3 mb-5">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold fs-5 text-dark" href="dashboard.html">
                <i class="fa-solid fa-scissors me-2 text-gradient"></i>Admin Workspace
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link fw-bold text-secondary me-3" href="dashboard.html"><i class="fa-solid fa-chart-pie me-2"></i>Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link fw-bold text-secondary me-3" href="inventory.html"><i class="fa-solid fa-boxes-stacked me-2"></i>Inventory</a></li>
                    <li class="nav-item"><a class="nav-link fw-bold text-secondary me-3" href="orders.html"><i class="fa-solid fa-cart-flatbed me-2"></i>Orders</a></li>
                    <li class="nav-item"><a class="nav-link fw-bold text-secondary me-3" href="quotes.html"><i class="fa-solid fa-file-invoice-dollar me-2"></i>Quotes</a></li>
                    <li class="nav-item"><a class="nav-link fw-bold text-dark" href="reports.html"><i class="fa-solid fa-file-export me-2"></i>Reports</a></li>
                </ul>
                <button class="btn btn-outline-dark btn-sm rounded-pill px-4" id="logoutBtn"><i class="fa-solid fa-power-off me-2"></i>Logout</button>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 animate-fade-up">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="text-center mb-4">
                    <i class="fa-solid fa-file-excel fs-1 text-gradient mb-3"></i>
                    <h2 class="fw-bold m-0">Export Data</h2>
                    <p class="text-secondary small mt-2">Download order and sales records to Excel format for offline analysis.</p>
                </div>
                
                <div class="glass-card">
                    <form id="reportForm">
                        <div class="mb-4">
                            <label class="form-label text-secondary small fw-bold text-uppercase">Time Period</label>
                            <select class="form-select glass-input text-dark" id="reportPeriod" name="period">
                                <option value="all" class="text-dark">All Time (Complete Record)</option>
                                <option value="day" class="text-dark">Today</option>
                                <option value="week" class="text-dark">Past 7 Days</option>
                                <option value="month" class="text-dark">This Month</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-modern w-100 py-3 fw-bold fs-5"><i class="fa-solid fa-download me-2"></i> Generate Excel File</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/api.js?v=5"></script>
    <script src="../assets/js/reports.js?v=3"></script>
</body>
</html>
